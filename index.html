<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stickman Count</title>
<meta name="theme-color" content="#69b7ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StickCount">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--blue:#2d8cff;--blue2:#1b5fd1;--red:#ff4b4b;--gold:#ffc83a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0d1b33;overflow:hidden;overscroll-behavior:none;touch-action:none;
  font-family:"Arial Rounded MT Bold","Trebuchet MS","Noto Sans KR",system-ui,sans-serif;color:#fff}
#stage{position:absolute;left:50%;top:0;height:100%;width:min(100vw,56.25vh);transform:translateX(-50%);overflow:hidden;background:#8c92f0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-50%);will-change:transform;
  min-width:34px;padding:2px 9px 3px;border-radius:999px;text-align:center;font-weight:900;font-size:15px;line-height:1.1;
  background:linear-gradient(#4aa8ff,#1f70e6);border:2px solid #fff;box-shadow:0 2px 0 rgba(0,40,120,.4);text-shadow:0 1px 0 rgba(0,30,100,.5);display:none}
.tag.red{background:linear-gradient(#ff6b5f,#e02a20);box-shadow:0 2px 0 rgba(120,0,0,.4);text-shadow:0 1px 0 rgba(100,0,0,.5);font-size:14px}
.tag.gray{background:linear-gradient(#b8c0cf,#7d8798);box-shadow:0 3px 0 rgba(30,40,60,.4);font-size:15px;text-shadow:none}
.tag.boss{min-width:150px;font-size:18px;padding:5px 14px;border-radius:14px}
.tag.boss i{display:block;height:8px;margin-top:4px;border-radius:5px;background:rgba(0,0,0,.35);overflow:hidden}
.tag.boss i b{display:block;height:100%;width:100%;background:#ffe14a;transform-origin:left}
.pop{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-weight:900;font-size:26px;color:#fff;text-shadow:0 3px 0 rgba(0,40,120,.7),0 0 8px rgba(0,0,0,.35);pointer-events:none;animation:pop .9s ease-out forwards}
.pop.bad{color:#ffb0b0;text-shadow:0 3px 0 rgba(120,0,0,.8),0 0 8px rgba(0,0,0,.35)}
@keyframes pop{0%{opacity:0;margin-top:0;scale:.5}15%{opacity:1;scale:1.15}100%{opacity:0;margin-top:-60px;scale:1}}
#top{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;align-items:center;gap:10px;pointer-events:none}
#lvl{flex:none;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:#2d8cff;border:2px solid #fff;font-weight:900;font-size:15px;line-height:22px;text-align:center;box-shadow:0 2px 0 rgba(0,40,120,.4)}
#prog{flex:1;height:10px;border-radius:6px;background:rgba(0,40,110,.28);border:2px solid rgba(255,255,255,.9);overflow:hidden;margin-left:-4px}
#flag{flex:none;font-size:18px;margin-left:-4px;line-height:1}
#prog i{display:block;height:100%;width:0;background:linear-gradient(#7dffa0,#2fcf5a)}
#coin{flex:none;display:flex;align-items:center;gap:6px;padding:3px 8px 3px 12px;border-radius:14px;background:rgba(40,80,150,.55);font-weight:900;font-size:14px;white-space:nowrap}
#coin b{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7b0,#ffc83a 55%,#d99100);border:2px solid #d98a00}
#pbtn{pointer-events:auto;width:34px;height:34px;border-radius:10px;border:3px solid #fff;background:linear-gradient(#4aa0ff,#1d63d8);color:#fff;font-weight:900;font-size:12px;padding:0;box-shadow:0 3px 0 rgba(0,40,120,.45)}
#hint{position:absolute;left:0;right:0;bottom:16%;text-align:center;font-weight:900;font-size:22px;text-shadow:0 3px 0 rgba(0,40,120,.7);pointer-events:none;display:none}
#hint small{display:block;font-size:14px;opacity:.9;margin-top:6px}
#hint .hand{display:inline-block;animation:sw 1.4s ease-in-out infinite;font-size:34px}
@keyframes sw{0%,100%{transform:translateX(-26px)}50%{transform:translateX(26px)}}
#ver{position:absolute;left:10px;bottom:calc(6px + env(safe-area-inset-bottom));font-size:11px;font-weight:700;opacity:.85;text-shadow:0 1px 0 rgba(0,30,90,.6);pointer-events:none}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,30,70,.45)}
.ov.on{display:flex}
.panel{width:min(82%,320px);padding:22px 18px 18px;border-radius:22px;background:linear-gradient(#ffffff,#dcebff);color:#12306b;text-align:center;border:4px solid #fff;box-shadow:0 8px 0 rgba(0,40,120,.35)}
.panel h1{margin:0 0 6px;font-size:30px;letter-spacing:1px;color:var(--blue2);text-shadow:0 2px 0 #fff}
.panel h1.lose{color:#d62a2a}
.panel p{margin:4px 0 14px;font-size:15px;font-weight:700;color:#35508a}
.panel .row{display:flex;justify-content:center;gap:14px;margin-bottom:14px;font-weight:900;font-size:16px}
.btn{display:block;width:100%;margin-top:8px;padding:13px;border:0;border-radius:16px;font:inherit;font-weight:900;font-size:19px;color:#fff;background:linear-gradient(#52d86e,#1f9e3e);box-shadow:0 5px 0 #146a29;text-shadow:0 2px 0 rgba(0,60,20,.5)}
.btn.alt{background:linear-gradient(#4aa0ff,#1d63d8);box-shadow:0 5px 0 #123f94;text-shadow:0 2px 0 rgba(0,30,100,.5);font-size:15px;padding:10px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #146a29}
#rotate{position:fixed;inset:0;z-index:99;background:#0d1b33;display:none;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:20px;color:#ffd24a;padding:20px;line-height:1.6}

.tag.orange{background:linear-gradient(#ffb455,#f0780f);box-shadow:0 2px 0 rgba(120,50,0,.4);text-shadow:0 1px 0 rgba(100,40,0,.5);font-size:14px}
.tag.mult{background:none;border:0;box-shadow:none;font-size:38px;font-style:italic;color:#ffe14a;text-shadow:0 3px 0 rgba(90,40,0,.7),0 0 10px rgba(0,0,0,.35);min-width:0;padding:0}
#hint{bottom:auto;top:50%}
#hint small{display:none}
#hint .hm{display:inline-flex;align-items:center;gap:10px;font-size:19px;letter-spacing:1px}
#hint .ar{display:inline-block;width:46px;height:3px;background:#fff;position:relative;opacity:.9}
#hint .ar:after{content:"";position:absolute;top:-6px;width:0;height:0;border:7.5px solid transparent}
#hint .ar.l:after{left:-4px;border-right:13px solid #fff;border-left:0}
#hint .ar.r:after{right:-4px;border-left:13px solid #fff;border-right:0}
#cards{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));display:none;justify-content:center;gap:14px;pointer-events:none}
.card{pointer-events:auto;width:36%;max-width:150px;border-radius:14px;overflow:hidden;border:3px solid #fff;text-align:center;color:#fff;background:linear-gradient(#4aa0ff,#2a6fd6);box-shadow:0 4px 0 rgba(10,30,90,.45);position:relative;padding-top:6px}
.card.gray{background:linear-gradient(#9aa6c4,#6c7899)}
.card .lv{position:absolute;left:8px;top:4px;text-align:left;font-weight:900;font-size:15px;line-height:1}
.card .lv b{display:block;font-size:20px}
.card .ic{font-size:44px;line-height:70px;height:72px}
.card .nm{font-weight:900;font-size:14px;padding-bottom:4px}
.card .bt{background:linear-gradient(#52d86e,#1f9e3e);padding:6px 0;font-weight:900;font-size:15px}
.card.dis .bt{background:linear-gradient(#8f98aa,#6d7688);opacity:.85}
.card:active{transform:translateY(2px)}
#wheel{position:absolute;left:7%;right:7%;top:38%;display:none;text-align:center;pointer-events:none}
#wheel.on{display:block}
#wheel .wt{font-weight:900;font-size:30px;letter-spacing:1px;text-shadow:0 3px 0 rgba(30,20,90,.7);margin-bottom:14px}
#wbox{position:relative}
#wbar{display:flex;border-radius:16px;overflow:hidden;border:4px solid #fff;box-shadow:0 5px 0 rgba(20,10,80,.4)}
#wbar .seg{flex:1;padding:11px 0;font-weight:900;font-size:21px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#wbar .seg.hit{filter:brightness(1.25);transform:scale(1.06)}
#wptr{position:absolute;top:100%;left:2%;width:0;height:0;margin-left:-13px;border:13px solid transparent;border-bottom:20px solid #fff;border-top:0;margin-top:3px;filter:drop-shadow(0 2px 0 rgba(20,10,80,.5))}

#lvlT{position:absolute;left:0;right:0;top:9%;text-align:center;font-weight:900;font-size:22px;letter-spacing:1px;text-shadow:0 3px 0 rgba(30,20,90,.6);display:none;pointer-events:none}
#bSkins{position:absolute;right:0;top:34%;display:none;width:62px;padding:6px 0 4px;border:3px solid #fff;border-right:0;border-radius:12px 0 0 12px;background:linear-gradient(#7be05a,#37b53a);color:#fff;font:inherit;font-weight:900;font-size:12px;box-shadow:0 3px 0 rgba(0,60,20,.4)}
#bSkins i{display:block;font-style:normal;font-size:30px;line-height:36px}
#store{background:linear-gradient(#2f66d8,#4a82f0);flex-direction:column;justify-content:flex-start;padding-top:calc(24px + env(safe-area-inset-top))}
#store h1{margin:30px 0 16px;font-size:28px;letter-spacing:2px}
#sback{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top));width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.9);font-size:22px;font-weight:900;color:#2a5fd0}
#scoinw{position:absolute;right:14px;top:calc(18px + env(safe-area-inset-top));font-weight:900;font-size:16px;background:rgba(10,30,100,.35);padding:4px 12px;border-radius:14px}
#sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(78%,300px)}
.sk{aspect-ratio:1;border-radius:16px;background:#1f4fc4;box-shadow:0 4px 0 #173a96;display:flex;align-items:center;justify-content:center;position:relative;border:3px solid transparent}
.sk.sel{border-color:#ff7a8a;background:#fff}
.sk.eq:after{content:"✔";position:absolute;right:4px;top:0;color:#5fe36a;font-weight:900;font-size:16px;text-shadow:0 1px 0 #064}
.sk i{display:block;width:46%;height:62%;border-radius:45% 45% 22% 22%;position:relative}
.sk i u{position:absolute;top:-9%;width:30%;height:22%;border-radius:50%;background:inherit}
.sk i u:first-child{left:-4%}.sk i u:last-child{right:-4%}
.sk.lock i{filter:brightness(.55) saturate(.4)}.sk.lock span{position:absolute;font-size:20px}
#sname{margin:16px 0 8px;font-weight:900;font-size:20px}
#store .btn{width:min(70%,260px)}
@media (orientation:landscape) and (max-height:520px) and (pointer:coarse){#rotate{display:flex}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="tags"></div>
  <div id="top"><div id="lvl">1</div><div id="prog"><i></i></div><div id="flag">🏁</div><div id="coin"><span id="coinV">0</span><b></b></div><button id="pbtn" aria-label="pause">❚❚</button></div>
  <div id="hint"><div class="hm"><span class="ar l"></span><b>HOLD &amp; MOVE</b><span class="ar r"></span></div><br><span class="hand">👆</span><small>SPACE / 클릭으로 시작</small></div>
  <div id="wheel"><div class="wt">TAP TO CHOOSE</div><div id="wbox"><div id="wbar"></div><div id="wptr"></div></div></div>
  <div id="lvlT"></div>
  <button id="bSkins"><i>🧍</i>SKINS</button>
  <div id="cards"><div class="card" id="cSU"><div class="lv">LVL<b>1</b></div><div class="ic">🧍</div><div class="nm">Start Units</div><div class="bt"><span class="cost">0</span> 🪙</div></div><div class="card gray" id="cInc"><div class="lv">LVL<b>1</b></div><div class="ic">💰</div><div class="nm">Income</div><div class="bt"><span class="cost">0</span> 🪙</div></div></div>
  <div id="ver"></div>
  <div class="ov" id="pause"><div class="panel"><h1>PAUSED</h1><p id="pauseMsg">일시정지</p>
    <button class="btn" id="bResume">계속하기</button><button class="btn alt" id="bRestart">처음부터 다시</button></div></div>
  <div class="ov" id="store"><button id="sback">←</button><div id="scoinw"><span id="scoin">0</span> 🪙</div><h1>STORE</h1><div id="sgrid"></div><div id="sname"></div><button class="btn" id="sbtn"></button></div>
  <div class="ov" id="result"><div class="panel"><h1 id="rTitle">COMPLETE!</h1><p id="rMsg"></p>
    <div class="row"><span id="rCoin"></span><span id="rCount"></span></div>
    <button class="btn" id="bNext">NEXT</button></div></div>
</div>
<div id="rotate">📱 세로 모드로 돌려주세요<br><small style="font-size:13px;color:#fff">이 게임은 세로 화면 전용입니다</small></div>
<script src="game.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
